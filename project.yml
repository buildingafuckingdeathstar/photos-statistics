name: PhotosStatistics
options:
  bundleIdPrefix: com.photosstatistics
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
targets:
  PhotosAccessProbe:
    type: application
    platform: macOS
    sources:
      - Sources/PhotosAccessProbe
      - Sources/LibraryProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photosstatistics.accessprobe
        PRODUCT_NAME: Photos Statistics
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photos Statistics
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Show locally available thumbnails for matching photos in your System Photo Library. This version does not change your photos or albums.
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Sources/PhotosAccessProbe/PhotosAccessProbe.entitlements
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: Photos.framework
schemes:
  PhotosAccessProbe:
    build:
      targets:
        PhotosAccessProbe: all
